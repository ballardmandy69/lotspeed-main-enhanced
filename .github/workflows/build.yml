name: Build kernel module

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and release metadata
        run: |
          bash -n install.sh install-v360.sh install-v361.sh install-v362.sh install-v363.sh install-v364.sh install-v365.sh install-v370.sh lotspeedctl
          grep -q 'MODULE_VERSION("3.7-enhanced")' lotspeed.c
          grep -q 'VERSION="3.7-enhanced"' install.sh
          grep -q 'VERSION="3.7-enhanced"' lotspeedctl
          grep -q 'write_param lotserver_rate 31250000' lotspeedctl
          grep -q 'write_param lotserver_degraded_enable 1' lotspeedctl
          grep -q 'write_param lotserver_degraded_rate_min 6250000' lotspeedctl
          grep -q 'write_param lotserver_degraded_rate_max 12500000' lotspeedctl
          grep -q 'write_param lotserver_degraded_gain 20' lotspeedctl
          grep -q 'write_param lotserver_hd_enable 0' lotspeedctl
          grep -q 'write_param lotserver_noncong_beta 900' lotspeedctl
          grep -q 'write_param lotserver_congestion_only 1' lotspeedctl
          grep -q 'write_param lotserver_min_rate_pct 20' lotspeedctl
          grep -q 'write_param lotserver_loss_congest_pct 30' lotspeedctl
          grep -q 'write_param lotserver_loss_recover_pct 25' lotspeedctl
          grep -q 'net.ipv4.tcp_rmem=8192 524288 16777216' lotspeedctl
          grep -q 'net.ipv4.tcp_wmem=8192 524288 16777216' lotspeedctl
          grep -q 'net.core.rmem_max=16777216' lotspeedctl
          grep -q 'net.core.wmem_max=16777216' lotspeedctl
          grep -q 'net.ipv4.tcp_notsent_lowat=262144' lotspeedctl
          grep -q 'net.ipv4.tcp_limit_output_bytes=1048576' lotspeedctl
      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic linux-headers-generic-hwe-24.04
      - name: Build
        run: |
          mapfile -t headers < <(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V)
          test "${#headers[@]}" -gt 0
          for header_dir in "${headers[@]}"; do
            make clean KERNEL_DIR="${header_dir}" || true
            make KERNEL_DIR="${header_dir}"
          done
